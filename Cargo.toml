[workspace]
resolver = "2"
members = [
    "crates/mixless-protocol",
    "crates/mixless-engine",
    "crates/mixless-library",
    "crates/mixless-pack",
    "crates/mixless-analyze",
    "crates/mixless-stems",
    "crates/mixless-tools",
    "crates/mixless-mixplan",
    "crates/mixless-spotify",
    "crates/mixless-net",
    "crates/mixless-acquire",
    "crates/mixless-acquire-yt",
    "crates/mixless-midi",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/backrunner/mixless"
rust-version = "1.88"

[workspace.dependencies]
mixless-protocol = { path = "crates/mixless-protocol" }
mixless-engine = { path = "crates/mixless-engine" }
mixless-library = { path = "crates/mixless-library" }
mixless-pack = { path = "crates/mixless-pack" }
mixless-analyze = { path = "crates/mixless-analyze" }
mixless-stems = { path = "crates/mixless-stems" }
mixless-mixplan = { path = "crates/mixless-mixplan" }
mixless-midi = { path = "crates/mixless-midi" }
mixless-spotify = { path = "crates/mixless-spotify" }
gpui = "0.2.2"
rfd = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
lofty = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.mixless-engine]
opt-level = 2
[profile.dev.package.ebur128]
opt-level = 2
[profile.dev.package.symphonia-core]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-bundle-flac]
opt-level = 2
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2
[profile.dev.package.symphonia-codec-pcm]
opt-level = 2
[profile.dev.package.gpui]
opt-level = 2
[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.mixless-analyze]
opt-level = 2
[profile.dev.package.mixless-stems]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2
[profile.dev.package.mixless-mixplan]
opt-level = 2
[profile.dev.package.mixless-desktop]
opt-level = 1
