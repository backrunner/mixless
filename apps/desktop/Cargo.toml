[package]
name = "mixless-desktop"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Mixless GPUI desktop app. No web, no DSP outside mixless-engine."

[[bin]]
name = "mixless"
path = "src/main.rs"

[dependencies]
mixless-engine = { workspace = true }
mixless-library = { workspace = true }
mixless-protocol = { workspace = true }
mixless-analyze = { workspace = true }
mixless-stems = { workspace = true }
mixless-mixplan = { workspace = true }
mixless-spotify = { workspace = true }
mixless-acquire = { path = "../../crates/mixless-acquire" }
mixless-acquire-yt = { path = "../../crates/mixless-acquire-yt" }
mixless-midi = { workspace = true }
gpui = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rfd = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lofty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
