name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Install WebAssembly C toolchain
        run: |
          brew install llvm lld
          "$(brew --prefix llvm)/bin/clang" --print-targets
          "$(brew --prefix lld)/bin/wasm-ld" --version
      - name: Test workspace crates
        run: cargo test --locked --workspace --exclude mixless-desktop
      - name: Test desktop and updater
        run: cargo test --locked -p mixless-desktop
      - name: Test controller development tools
        run: cargo test --locked -p mixless-controllers --features tools
      - name: Compile and replay independent HID example
        run: |
          CLANG="$(brew --prefix llvm)/bin/clang" \
          WASM_LD="$(brew --prefix lld)/bin/wasm-ld" \
          python3 crates/mixless-controllers/sdk/verify-example.py
