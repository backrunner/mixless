[package]
name = "mixless-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native offline stem separation and note inference"

[dependencies]
mixless-protocol.workspace = true
mixless-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hound = "3"
rustfft = "6"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
