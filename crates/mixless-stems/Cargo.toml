[package]
name = "mixless-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native offline stem separation and note inference"

[dependencies]
mixless-protocol.workspace = true
mixless-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hound = "3"
rustfft = "6"
fs2 = "0.4"
tempfile = "3"

# ONNX Runtime ships no x86_64-apple-darwin prebuilt (dropped by upstream and
# pyke ort after 1.23). Inference is gated off there; cached stems still play.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
onnx-protobuf = "0.2.3"
# onnx-protobuf's generated bindings require this exact protobuf version.
protobuf = "=3.4.0"
libloading = "0.8"
libc = "0.2"
