[package]
name = "mixless-controllers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Independent MIDI/HID controller runtime and portable profiles"

[features]
tools = ["dep:wat", "dep:tempfile"]

[[bin]]
name = "mixless-controller"
path = "src/bin/controller.rs"
required-features = ["tools"]

[dependencies]
mixless-midi = { workspace = true }
mixless-protocol = { workspace = true }
hidapi = "2.6.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
blake3 = { workspace = true }
semver = "1"
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }
wat = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
mixless-engine = { workspace = true }
wat = "1"
tempfile = "3"
